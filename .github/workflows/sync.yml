name: Sync fork

on:
  schedule:
    - cron: '0 */6 * * *'   # Run every 6 hours
  workflow_dispatch:         # Allow manual runs from the Actions tab

permissions:
  contents: write            # Required to push synced commits to the fork

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Sync the fork's branch with the upstream repository.
      # Replace "main" with your default branch (e.g. "master").
      # Fails if the fork has commits that upstream doesn't (needs merge/rebase).
      - run: gh repo sync ${{ github.repository }} --branch master
        env:
          # If upstream changes files in .github/workflows, replace this with
          # a personal access token (scope: workflow) stored as a repo secret.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}